# ═══════════════════════════════════════════════════════════════════════════
# Sync Modules to Cloudflare R2 CDN
# 
# This workflow automatically uploads PC modules to R2 when changes are pushed.
# Modules are used by StarshipCore for faster loading via Cloudflare CDN.
# ═══════════════════════════════════════════════════════════════════════════

name: Sync Modules to R2 CDN

on:
  push:
    branches:
      - main
    paths:
      # Only trigger when module files change
      - 'data/Modules/**'
      - 'data/StarshipCore.lua'
      - 'data/StarshipCore-obfuscated.lua'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync-to-r2:
    name: Upload to Cloudflare R2
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need 2 commits for git diff HEAD~1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Sync Modules to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          echo "🚀 Starting module sync to R2..."
          
          # Get list of changed files (comparing with previous commit)
          # For workflow_dispatch (manual trigger), upload all files
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "📋 Manual trigger detected - uploading ALL files"
            CHANGED_FILES=$(find data/Modules -name "*.lua" -type f)
            UPLOAD_ALL=true
          else
            echo "📋 Push trigger detected - uploading CHANGED files only"
            # Use ** glob pattern for recursive matching
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- 'data/Modules/' 'data/StarshipCore.lua' 2>/dev/null | grep '\.lua$' || echo "")
            echo "📋 Changed files: $CHANGED_FILES"
            UPLOAD_ALL=false
          fi
          
          if [ -z "$CHANGED_FILES" ] && [ "$UPLOAD_ALL" = "false" ]; then
            echo "ℹ️ No module files changed in this commit"
            exit 0
          fi
          
          UPLOAD_COUNT=0
          
          # Upload changed main modules
          echo "📦 Checking Modules..."
          for file in data/Modules/*.lua; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              if [ "$UPLOAD_ALL" = "true" ] || echo "$CHANGED_FILES" | grep -q "$file"; then
                echo "  → Uploading $filename"
                wrangler r2 object put "$R2_BUCKET_NAME/pc/Modules/$filename" --file="$file" --content-type="text/plain" --remote
                UPLOAD_COUNT=$((UPLOAD_COUNT + 1))
              fi
            fi
          done
          
          # Upload changed Tabs
          echo "📦 Checking Tabs..."
          for file in data/Modules/Tabs/*.lua; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              if [ "$UPLOAD_ALL" = "true" ] || echo "$CHANGED_FILES" | grep -q "$file"; then
                echo "  → Uploading Tabs/$filename"
                wrangler r2 object put "$R2_BUCKET_NAME/pc/Modules/Tabs/$filename" --file="$file" --content-type="text/plain" --remote
                UPLOAD_COUNT=$((UPLOAD_COUNT + 1))
              fi
            fi
          done
          
          # Upload StarshipCore if changed
          if [ -f "data/StarshipCore.lua" ]; then
            if [ "$UPLOAD_ALL" = "true" ] || echo "$CHANGED_FILES" | grep -q "data/StarshipCore.lua"; then
              echo "📦 Uploading StarshipCore.lua..."
              wrangler r2 object put "$R2_BUCKET_NAME/pc/StarshipCore.lua" --file="data/StarshipCore.lua" --content-type="text/plain" --remote
              UPLOAD_COUNT=$((UPLOAD_COUNT + 1))
            fi
          fi
          
          echo "✅ Synced $UPLOAD_COUNT file(s) to R2 CDN!"

      - name: Summary
        run: |
          echo "## ✅ R2 Sync Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Modules have been uploaded to Cloudflare R2 CDN." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Uploaded Files:" >> $GITHUB_STEP_SUMMARY
          echo "- \`pc/Modules/*.lua\` - Main modules" >> $GITHUB_STEP_SUMMARY
          echo "- \`pc/Modules/Tabs/*.lua\` - Tab modules" >> $GITHUB_STEP_SUMMARY
          echo "- \`pc/StarshipCore.lua\` - Main script" >> $GITHUB_STEP_SUMMARY
