<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verifikasi Discord - Starship VIP</title>
    <link rel="icon" type="image/png" href="/starship-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg-body: #050507;
            --bg-surface: #0a0a0f;
            --bg-card: rgba(15, 15, 22, 0.7);
            --accent: #ff2d2d;
            --accent-glow: rgba(255, 45, 45, 0.4);
            --discord: #5865F2;
            --gold: #ffb800;
            --cyan: #00f2ff;
            --success: #00e676;
            --text: #ffffff;
            --text-muted: #888899;
            --border: 1px solid rgba(255, 255, 255, 0.04);
            --border-bright: 1px solid rgba(255, 255, 255, 0.1);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 8px;
            --font-main: 'Inter', sans-serif;
            --font-tech: 'Space Grotesk', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
            --transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text);
            font-family: var(--font-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255, 45, 45, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 255, 0.03) 0%, transparent 40%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.04;
            pointer-events: none;
            z-index: 1;
        }

        .nav-tools {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 2000;
        }

        .lang-switcher-tool {
            background: rgba(255, 255, 255, 0.03);
            border: var(--border-bright);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-sm);
            overflow: hidden;
            display: flex;
        }

        .lang-btn {
            padding: 10px 15px;
            background: transparent;
            border: none;
            color: #fff;
            font-family: var(--font-code);
            font-size: 11px;
            cursor: pointer;
            transition: var(--transition);
        }

        .lang-btn.active {
            background: var(--accent);
        }

        .main-content {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
        }

        .star-panel {
            background: var(--bg-surface);
            border: var(--border-bright);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .panel-glow {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(88, 101, 242, 0.2) 0%, transparent 70%);
            opacity: 0.15;
            pointer-events: none;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(88, 101, 242, 0.4));
        }

        h1 {
            font-family: var(--font-tech);
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Step Boxes */
        .step-box {
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            padding: 25px;
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .step-box.completed {
            border-color: var(--success);
            background: rgba(0, 230, 118, 0.02);
        }

        .step-box.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .step-number {
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-code);
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .step-box.active .step-number {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .step-box.completed .step-number {
            background: var(--success);
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.3);
        }

        .step-title {
            font-family: var(--font-tech);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        /* Discord Branding */
        .discord-btn {
            width: 100%;
            padding: 18px;
            background: var(--discord);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-family: var(--font-tech);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: var(--transition);
            box-shadow: 0 10px 20px rgba(88, 101, 242, 0.2);
        }

        .discord-btn:hover {
            transform: translateY(-2px);
            background: #4752c4;
            box-shadow: 0 15px 30px rgba(88, 101, 242, 0.3);
        }

        /* User Identity Card */
        .user-identity {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: rgba(88, 101, 242, 0.1);
            border: 1px solid rgba(88, 101, 242, 0.2);
            border-radius: var(--radius-sm);
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--discord);
        }

        .user-info-text {
            flex: 1;
        }

        .user-name {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .user-id {
            font-family: var(--font-code);
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* Roblox Input Area */
        .roblox-input-container {
            display: flex;
            gap: 10px;
        }

        .input-elite {
            flex: 1;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-sm);
            color: #fff;
            font-family: var(--font-code);
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .input-elite:focus {
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.5);
        }

        .verify-btn {
            padding: 0 20px;
            background: var(--accent);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-family: var(--font-tech);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .verify-btn:disabled {
            background: #222;
            color: #555;
            cursor: not-allowed;
        }

        /* Result Area */
        .result-panel {
            margin-top: 30px;
            padding: 25px;
            border-radius: var(--radius-md);
            text-align: center;
            display: none;
            animation: slideUp 0.5s ease;
        }

        .result-panel.show {
            display: block;
        }

        .result-panel.success {
            background: rgba(0, 230, 118, 0.05);
            border: 1px solid rgba(0, 230, 118, 0.1);
        }

        .result-panel.error {
            background: rgba(255, 45, 45, 0.05);
            border: 1px solid rgba(255, 45, 45, 0.1);
        }

        .result-title {
            font-family: var(--font-tech);
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .success .result-title {
            color: var(--success);
        }

        .error .result-title {
            color: var(--accent);
        }

        .roles-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
        }

        .role-chip {
            padding: 6px 12px;
            background: var(--discord);
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: var(--font-tech);
            letter-spacing: 0.5px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .back-link:hover {
            color: #fff;
        }

        /* Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 500px) {
            .roblox-input-container {
                flex-direction: column;
            }

            .verify-btn {
                height: 55px;
            }
        }
    </style>
</head>

<body>
    <!-- Tools -->
    <div class="nav-tools">
        <div class="lang-switcher-tool">
            <button class="lang-btn active" onclick="setLanguage('id')" id="lang-id">ID</button>
            <button class="lang-btn" onclick="setLanguage('en')" id="lang-en">EN</button>
        </div>
    </div>

    <div class="main-content">
        <div class="star-panel">
            <div class="panel-glow"></div>

            <div class="header">
                <img src="/starship-logo.png" alt="Starship" class="logo">
                <h1 data-i18n="title">Verifikasi Discord</h1>
                <p class="subtitle" data-i18n="subtitle">Sinkronisasi status VIP Anda ke Discord</p>
            </div>

            <!-- Step 1 -->
            <div class="step-box active" id="step1">
                <div class="step-header">
                    <div class="step-number">1</div>
                    <span class="step-title" data-i18n="step1_title">Login dengan Discord</span>
                </div>

                <button class="discord-btn" id="discord-login-btn" onclick="loginDiscord()">
                    <i class="fab fa-discord" style="font-size: 1.2rem;"></i>
                    <span data-i18n="login_discord">Login dengan Discord</span>
                </button>

                <div class="user-identity" id="discord-user" style="display: none;">
                    <img class="user-avatar" id="discord-avatar" src="" alt="Avatar">
                    <div class="user-info-text">
                        <div class="user-name" id="discord-name">-</div>
                        <div class="user-id" id="discord-id">-</div>
                    </div>
                    <i class="fas fa-check-circle" style="color: var(--success);"></i>
                </div>
            </div>

            <!-- Step 2 -->
            <div class="step-box disabled" id="step2">
                <div class="step-header">
                    <div class="step-number">2</div>
                    <span class="step-title" data-i18n="step2_title">Masukkan Roblox ID</span>
                </div>

                <div class="roblox-input-container">
                    <input type="text" class="input-elite" id="roblox-input" data-i18n-placeholder="roblox_placeholder"
                        placeholder="Contoh: 9337569193">
                    <button class="verify-btn" id="verify-btn" onclick="verifyVip()" disabled
                        data-i18n="verify_btn">VERIFIKASI</button>
                </div>
            </div>

            <!-- Global Result Area -->
            <div id="loading-area" style="display: none; text-align: center; padding: 20px;">
                <div class="spinner" style="margin: 0 auto 15px;"></div>
                <p style="font-family: var(--font-code); font-size: 0.8rem; color: var(--text-muted);"
                    data-i18n="verifying">MEMPROSES DATA...</p>
            </div>

            <div class="result-panel" id="result">
                <div class="result-title" id="result-title">-</div>
                <p id="result-message" style="color: var(--text-muted); font-size: 0.9rem;"></p>
                <div class="roles-container" id="roles-list"></div>
            </div>

            <a href="/" class="back-link" data-i18n="back_home">← KEMBALI KE HOMEPAGE</a>
        </div>
    </div>

    <script>
        const translations = {
            id: {
                title: "Verifikasi Discord",
                subtitle: "Hubungkan akun Discord untuk mendapat role VIP",
                step1_title: "Login dengan Discord",
                step2_title: "Masukkan Roblox ID",
                login_discord: "Login dengan Discord",
                roblox_placeholder: "CONTOH: 9337569193",
                verify_btn: "VERIFIKASI",
                verifying: "MEMPROSES DATA...",
                back_home: "← KEMBALI KE HOMEPAGE",
                login_failed: "LOGIN GAGAL",
                login_error: "Gagal login dengan Discord",
                error: "ERROR",
                login_issue: "Terjadi kesalahan saat login",
                invalid_id: "ID TIDAK VALID",
                invalid_id_msg: "Masukkan Roblox ID yang valid (angka saja)",
                login_first: "LOGIN DULU",
                login_first_msg: "Silakan login dengan Discord terlebih dahulu",
                success: "🎉 VERIFIKASI BERHASIL!",
                failed: "❌ VERIFIKASI GAGAL",
                not_found: "Roblox ID tidak ditemukan di VIP list",
                verify_error: "Terjadi kesalahan saat verifikasi"
            },
            en: {
                title: "Verify Discord",
                subtitle: "Connect your Discord account to get VIP role",
                step1_title: "Login with Discord",
                step2_title: "Enter Roblox ID",
                login_discord: "Login with Discord",
                roblox_placeholder: "EXAMPLE: 9337569193",
                verify_btn: "VERIFY",
                verifying: "PROCESSING DATA...",
                back_home: "← BACK TO HOMEPAGE",
                login_failed: "LOGIN FAILED",
                login_error: "Failed to login with Discord",
                error: "ERROR",
                login_issue: "An error occurred during login",
                invalid_id: "INVALID ID",
                invalid_id_msg: "Enter a valid Roblox ID (numbers only)",
                login_first: "LOGIN FIRST",
                login_first_msg: "Please login with Discord first",
                success: "🎉 VERIFICATION SUCCESS!",
                failed: "❌ VERIFICATION FAILED",
                not_found: "Roblox ID not found in VIP list",
                verify_error: "An error occurred during verification"
            }
        };

        let currentLang = localStorage.getItem('starship_lang') || 'id';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('starship_lang', lang);
            document.getElementById('lang-id').classList.toggle('active', lang === 'id');
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang][key]) el.placeholder = translations[lang][key];
            });

            document.title = lang === 'id' ? 'Verifikasi Discord - Starship VIP' : 'Verify Discord - Starship VIP';
        }

        const CLIENT_ID = '1456290071337762892';
        const REDIRECT_URI = encodeURIComponent(window.location.origin + '/verify.html');
        const OAUTH_URL = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=code&scope=identify`;

        let discordUser = null;

        window.onload = function () {
            setLanguage(currentLang);
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) exchangeCode(code);

            const savedUser = localStorage.getItem('discord_user');
            if (savedUser) {
                discordUser = JSON.parse(savedUser);
                showDiscordUser(discordUser);
            }
        };

        function loginDiscord() { window.location.href = OAUTH_URL; }

        async function exchangeCode(code) {
            document.getElementById('loading-area').style.display = 'block';
            document.getElementById('step1').classList.add('disabled');

            try {
                const response = await fetch('/api/tags', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'discord_oauth',
                        code: code,
                        redirectUri: window.location.origin + '/verify.html'
                    })
                });

                const data = await response.json();

                if (data.success && data.user) {
                    discordUser = data.user;
                    localStorage.setItem('discord_user', JSON.stringify(discordUser));
                    showDiscordUser(discordUser);
                    window.history.replaceState({}, document.title, '/verify.html');
                } else {
                    showResult('error', t('login_failed'), data.error || t('login_error'));
                }
            } catch (error) {
                showResult('error', t('error'), t('login_issue'));
            }

            document.getElementById('loading-area').style.display = 'none';
        }

        function showDiscordUser(user) {
            document.getElementById('discord-login-btn').style.display = 'none';
            document.getElementById('discord-user').style.display = 'flex';
            document.getElementById('discord-avatar').src = user.avatar
                ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
                : 'https://cdn.discordapp.com/embed/avatars/0.png';
            document.getElementById('discord-name').textContent = user.username;
            document.getElementById('discord-id').textContent = `ID: ${user.id}`;

            document.getElementById('step1').classList.add('completed');
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.remove('disabled');
            document.getElementById('step2').classList.add('active');
            document.getElementById('verify-btn').disabled = false;
        }

        async function verifyVip() {
            const robloxId = document.getElementById('roblox-input').value.trim();
            if (!robloxId || !/^\d+$/.test(robloxId)) {
                showResult('error', t('invalid_id'), t('invalid_id_msg'));
                return;
            }

            document.getElementById('loading-area').style.display = 'block';
            document.getElementById('verify-btn').disabled = true;
            document.getElementById('result').classList.remove('show');

            try {
                const response = await fetch('/api/tags', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'verify',
                        robloxId: robloxId,
                        discordId: discordUser.id
                    })
                });

                const data = await response.json();
                if (data.success) {
                    showResult('success', t('success'), data.message);
                    const rolesList = document.getElementById('roles-list');
                    rolesList.innerHTML = '';
                    if (data.rolesAssigned) {
                        data.rolesAssigned.forEach(role => {
                            rolesList.innerHTML += `<span class="role-chip">${role}</span>`;
                        });
                    }
                    document.getElementById('step2').classList.add('completed');
                } else {
                    showResult('error', t('failed'), data.message || t('not_found'));
                }
            } catch (error) {
                showResult('error', t('error'), t('verify_error'));
            }

            document.getElementById('loading-area').style.display = 'none';
            document.getElementById('verify-btn').disabled = false;
        }

        function showResult(type, title, message) {
            const result = document.getElementById('result');
            result.className = `result-panel show ${type}`;
            document.getElementById('result-title').textContent = title;
            document.getElementById('result-message').textContent = message;
            result.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function t(key) { return translations[currentLang][key] || key; }
        document.getElementById('roblox-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') verifyVip(); });
    </script>
</body>

</html>
