<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Discord - Starship VIP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #1a1a2e;
            --white: #ffffff;
            --bg: #f5f5f5;
            --accent-1: #e94560;
            --accent-2: #5865F2;
            --accent-3: #43d9ad;
            --border: 3px solid var(--black);
            --shadow: 6px 6px 0 var(--black);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .verify-card {
            background: var(--white);
            border: var(--border);
            box-shadow: var(--shadow);
            max-width: 450px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }

        .logo {
            width: 80px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        /* Language Switcher */
        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 5px;
            background: var(--white);
            border: var(--border);
            padding: 5px;
            box-shadow: 4px 4px 0 var(--black);
        }

        .lang-btn {
            padding: 8px 12px;
            border: 2px solid transparent;
            background: transparent;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .lang-btn:hover {
            background: var(--bg);
        }

        .lang-btn.active {
            background: var(--accent-2);
            color: var(--white);
            border-color: var(--black);
        }

        /* Steps */
        .step {
            background: var(--bg);
            border: var(--border);
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .step-number {
            background: var(--accent-2);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .step-title {
            font-weight: 700;
        }

        .step.completed .step-number {
            background: var(--accent-3);
        }

        .step.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        /* Discord Button */
        .discord-btn {
            background: var(--accent-2);
            color: white;
            border: var(--border);
            padding: 15px 30px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.15s ease;
            box-shadow: 4px 4px 0 var(--black);
        }

        .discord-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--black);
        }

        .discord-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Input */
        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 15px;
            border: var(--border);
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
        }

        .verify-btn {
            background: var(--accent-3);
            color: var(--black);
            border: var(--border);
            padding: 12px 20px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .verify-btn:hover:not(:disabled) {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0 var(--black);
        }

        .verify-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* User Info */
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--accent-3);
            padding: 15px;
            border: var(--border);
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--black);
        }

        .user-details {
            text-align: left;
        }

        .user-name {
            font-weight: 700;
        }

        .user-id {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: #333;
        }

        /* Result */
        .result {
            margin-top: 20px;
            padding: 20px;
            border: var(--border);
            display: none;
        }

        .result.success {
            background: #e8f5e9;
            display: block;
        }

        .result.error {
            background: #ffebee;
            display: block;
        }

        .result h3 {
            margin-bottom: 10px;
        }

        .roles-list {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .role-badge {
            background: var(--accent-2);
            color: white;
            padding: 8px 15px;
            border: 2px solid var(--black);
            font-weight: 700;
            font-size: 0.85rem;
        }

        /* Loading */
        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--bg);
            border-top-color: var(--accent-2);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer-link {
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .footer-link a {
            color: var(--accent-2);
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .lang-switcher {
                position: relative;
                top: auto;
                right: auto;
                margin-bottom: 20px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Language Switcher -->
    <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLanguage('id')" id="lang-id">🇮🇩 ID</button>
        <button class="lang-btn" onclick="setLanguage('en')" id="lang-en">🇬🇧 EN</button>
    </div>

    <div class="verify-card">
        <img src="/starship-logo.png" alt="Starship" class="logo">
        <h1 data-i18n="title">Verifikasi Discord</h1>
        <p class="subtitle" data-i18n="subtitle">Hubungkan akun Discord untuk mendapat role VIP</p>

        <!-- Step 1: Discord Login -->
        <div class="step" id="step1">
            <div class="step-header">
                <div class="step-number">1</div>
                <span class="step-title" data-i18n="step1_title">Login dengan Discord</span>
            </div>
            <button class="discord-btn" id="discord-login-btn" onclick="loginDiscord()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                </svg>
                <span data-i18n="login_discord">Login dengan Discord</span>
            </button>
            <div class="user-info" id="discord-user" style="display: none;">
                <img class="user-avatar" id="discord-avatar" src="" alt="">
                <div class="user-details">
                    <div class="user-name" id="discord-name">-</div>
                    <div class="user-id" id="discord-id">-</div>
                </div>
            </div>
        </div>

        <!-- Step 2: Enter Roblox ID -->
        <div class="step disabled" id="step2">
            <div class="step-header">
                <div class="step-number">2</div>
                <span class="step-title" data-i18n="step2_title">Masukkan Roblox ID</span>
            </div>
            <div class="input-group">
                <input type="text" id="roblox-input" data-i18n-placeholder="roblox_placeholder" placeholder="Contoh: 9337569193">
                <button class="verify-btn" id="verify-btn" onclick="verifyVip()" disabled data-i18n="verify_btn">Verifikasi</button>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <span data-i18n="verifying">Memverifikasi...</span>
        </div>

        <!-- Result -->
        <div class="result" id="result">
            <h3 id="result-title">-</h3>
            <p id="result-message">-</p>
            <div class="roles-list" id="roles-list"></div>
        </div>

        <div class="footer-link">
            <a href="/" data-i18n="back_home">← Kembali ke Homepage</a>
        </div>
    </div>

    <script>
        // ============ TRANSLATIONS ============
        const translations = {
            id: {
                title: "Verifikasi Discord",
                subtitle: "Hubungkan akun Discord untuk mendapat role VIP",
                step1_title: "Login dengan Discord",
                step2_title: "Masukkan Roblox ID",
                login_discord: "Login dengan Discord",
                roblox_placeholder: "Contoh: 9337569193",
                verify_btn: "Verifikasi",
                verifying: "Memverifikasi...",
                back_home: "← Kembali ke Homepage",
                login_failed: "Login Gagal",
                login_error: "Gagal login dengan Discord",
                error: "Error",
                login_issue: "Terjadi kesalahan saat login",
                invalid_id: "ID Tidak Valid",
                invalid_id_msg: "Masukkan Roblox ID yang valid (angka saja)",
                login_first: "Login Dulu",
                login_first_msg: "Silakan login dengan Discord terlebih dahulu",
                success: "🎉 Verifikasi Berhasil!",
                failed: "❌ Verifikasi Gagal",
                not_found: "Roblox ID tidak ditemukan di VIP list",
                verify_error: "Terjadi kesalahan saat verifikasi"
            },
            en: {
                title: "Verify Discord",
                subtitle: "Connect your Discord account to get VIP role",
                step1_title: "Login with Discord",
                step2_title: "Enter Roblox ID",
                login_discord: "Login with Discord",
                roblox_placeholder: "Example: 9337569193",
                verify_btn: "Verify",
                verifying: "Verifying...",
                back_home: "← Back to Homepage",
                login_failed: "Login Failed",
                login_error: "Failed to login with Discord",
                error: "Error",
                login_issue: "An error occurred during login",
                invalid_id: "Invalid ID",
                invalid_id_msg: "Enter a valid Roblox ID (numbers only)",
                login_first: "Login First",
                login_first_msg: "Please login with Discord first",
                success: "🎉 Verification Successful!",
                failed: "❌ Verification Failed",
                not_found: "Roblox ID not found in VIP list",
                verify_error: "An error occurred during verification"
            }
        };

        let currentLang = localStorage.getItem('starship_lang') || 'id';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('starship_lang', lang);
            
            // Update buttons
            document.getElementById('lang-id').classList.toggle('active', lang === 'id');
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
            
            // Update all translatable elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            
            // Update placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });

            // Update page title
            document.title = lang === 'id' ? 'Verifikasi Discord - Starship VIP' : 'Verify Discord - Starship VIP';
        }

        function t(key) {
            return translations[currentLang][key] || translations['id'][key] || key;
        }

        const CLIENT_ID = '1456290071337762892';
        const REDIRECT_URI = encodeURIComponent(window.location.origin + '/verify.html');
        const OAUTH_URL = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=code&scope=identify`;

        let discordUser = null;

        // Check for OAuth callback
        window.onload = function() {
            // Initialize language
            setLanguage(currentLang);
            
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            
            if (code) {
                // Exchange code for user info
                exchangeCode(code);
            }

            // Check localStorage for saved Discord user
            const savedUser = localStorage.getItem('discord_user');
            if (savedUser) {
                discordUser = JSON.parse(savedUser);
                showDiscordUser(discordUser);
            }
        };

        function loginDiscord() {
            window.location.href = OAUTH_URL;
        }

        async function exchangeCode(code) {
            document.getElementById('loading').classList.add('show');
            document.getElementById('step1').classList.add('disabled');

            try {
                const response = await fetch('/api/tags', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        action: 'discord_oauth',
                        code: code,
                        redirectUri: window.location.origin + '/verify.html'
                    })
                });

                const data = await response.json();

                if (data.success && data.user) {
                    discordUser = data.user;
                    localStorage.setItem('discord_user', JSON.stringify(discordUser));
                    showDiscordUser(discordUser);
                    
                    // Clean URL
                    window.history.replaceState({}, document.title, '/verify.html');
                } else {
                    showResult('error', t('login_failed'), data.error || t('login_error'));
                }
            } catch (error) {
                console.error('OAuth error:', error);
                showResult('error', t('error'), t('login_issue'));
            }

            document.getElementById('loading').classList.remove('show');
            document.getElementById('step1').classList.remove('disabled');
        }

        function showDiscordUser(user) {
            document.getElementById('discord-login-btn').style.display = 'none';
            document.getElementById('discord-user').style.display = 'flex';
            document.getElementById('discord-avatar').src = user.avatar 
                ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
                : 'https://cdn.discordapp.com/embed/avatars/0.png';
            document.getElementById('discord-name').textContent = user.username;
            document.getElementById('discord-id').textContent = `ID: ${user.id}`;

            // Enable step 2
            document.getElementById('step1').classList.add('completed');
            document.getElementById('step2').classList.remove('disabled');
            document.getElementById('verify-btn').disabled = false;
        }

        async function verifyVip() {
            const robloxId = document.getElementById('roblox-input').value.trim();
            
            if (!robloxId || !/^\d+$/.test(robloxId)) {
                showResult('error', t('invalid_id'), t('invalid_id_msg'));
                return;
            }

            if (!discordUser) {
                showResult('error', t('login_first'), t('login_first_msg'));
                return;
            }

            document.getElementById('loading').classList.add('show');
            document.getElementById('verify-btn').disabled = true;

            try {
                const response = await fetch('/api/tags', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'verify',
                        robloxId: robloxId,
                        discordId: discordUser.id
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showResult('success', t('success'), data.message);
                    
                    // Show roles
                    const rolesList = document.getElementById('roles-list');
                    rolesList.innerHTML = '';
                    if (data.rolesAssigned && data.rolesAssigned.length > 0) {
                        data.rolesAssigned.forEach(role => {
                            rolesList.innerHTML += `<span class="role-badge">${role}</span>`;
                        });
                    }
                } else {
                    showResult('error', t('failed'), data.message || t('not_found'));
                }
            } catch (error) {
                console.error('Verify error:', error);
                showResult('error', t('error'), t('verify_error'));
            }

            document.getElementById('loading').classList.remove('show');
            document.getElementById('verify-btn').disabled = false;
        }

        function showResult(type, title, message) {
            const result = document.getElementById('result');
            result.className = `result ${type}`;
            document.getElementById('result-title').textContent = title;
            document.getElementById('result-message').textContent = message;
        }
    </script>
</body>
</html>
