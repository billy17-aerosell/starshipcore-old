<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test - StarshipCore</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #00ff00;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            background: #2d2d2d;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border-left: 4px solid #00ff00;
        }
        button {
            background: #00ff00;
            color: #1e1e1e;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #00cc00;
        }
        pre {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        input {
            background: #2d2d2d;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 8px;
            width: 300px;
            border-radius: 5px;
        }
        h1 { color: #00ff00; }
        h2 { color: #00cc00; }
        .error { color: #ff0000; }
        .success { color: #00ff00; }
    </style>
</head>
<body>
    <h1>🧪 API Endpoint Tester</h1>
    <p>Test whitelist management API endpoints</p>

    <div class="test-section">
        <h2>Setup</h2>
        <label>Admin Secret:</label>
        <input type="password" id="adminSecret" placeholder="Enter admin secret">
    </div>

    <div class="test-section">
        <h2>Test 1: List Whitelist</h2>
        <button onclick="testList()">📋 Test List Endpoint</button>
        <pre id="listResult">Result will appear here...</pre>
    </div>

    <div class="test-section">
        <h2>Test 2: Add VIP User</h2>
        <input type="text" id="testUserId" placeholder="User ID (e.g., 999888777)" style="display: block; margin: 10px 0;">
        <input type="text" id="testUsername" placeholder="Username (e.g., TestUser)" style="display: block; margin: 10px 0;">
        <button onclick="testAdd()">➕ Test Add Endpoint</button>
        <pre id="addResult">Result will appear here...</pre>
    </div>

    <div class="test-section">
        <h2>Test 3: Check File (via loader endpoint)</h2>
        <button onclick="checkFile()">📄 Check Current keys.json</button>
        <pre id="fileResult">Result will appear here...</pre>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function getSecret() {
            return document.getElementById('adminSecret').value;
        }

        async function testList() {
            const secret = getSecret();
            if (!secret) {
                document.getElementById('listResult').innerHTML = '<span class="error">Please enter admin secret first!</span>';
                return;
            }

            document.getElementById('listResult').innerHTML = 'Testing...';

            try {
                const response = await fetch(`${API_BASE}/api/whitelist-manager?action=list`, {
                    headers: {
                        'X-Admin-Secret': secret
                    }
                });

                const data = await response.json();
                
                document.getElementById('listResult').innerHTML = 
                    `<span class="${response.ok ? 'success' : 'error'}">Status: ${response.status} ${response.statusText}</span>\n\n` +
                    JSON.stringify(data, null, 2);
                
            } catch (error) {
                document.getElementById('listResult').innerHTML = 
                    `<span class="error">Error: ${error.message}</span>`;
            }
        }

        async function testAdd() {
            const secret = getSecret();
            const userId = document.getElementById('testUserId').value || '999888777';
            const username = document.getElementById('testUsername').value || 'APITestUser';

            if (!secret) {
                document.getElementById('addResult').innerHTML = '<span class="error">Please enter admin secret first!</span>';
                return;
            }

            document.getElementById('addResult').innerHTML = 'Testing...';

            try {
                const response = await fetch(`${API_BASE}/api/whitelist-manager?action=add`, {
                    method: 'POST',
                    headers: {
                        'X-Admin-Secret': secret,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userId: userId,
                        username: username,
                        type: 'vip',
                        maxDevices: 5,
                        notes: 'Added via API test'
                    })
                });

                const data = await response.json();
                
                document.getElementById('addResult').innerHTML = 
                    `<span class="${response.ok ? 'success' : 'error'}">Status: ${response.status} ${response.statusText}</span>\n\n` +
                    JSON.stringify(data, null, 2);
                
            } catch (error) {
                document.getElementById('addResult').innerHTML = 
                    `<span class="error">Error: ${error.message}</span>`;
            }
        }

        async function checkFile() {
            document.getElementById('fileResult').innerHTML = 'Checking...';

            try {
                // Try to read via a test endpoint
                const response = await fetch(`${API_BASE}/api/whitelist-manager?action=list`, {
                    headers: {
                        'X-Admin-Secret': getSecret()
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    const userCount = Object.keys(data.whitelist || {}).length;
                    
                    document.getElementById('fileResult').innerHTML = 
                        `<span class="success">✅ API is accessible!</span>\n\n` +
                        `Total users in whitelist: ${userCount}\n\n` +
                        `Users:\n` +
                        Object.keys(data.whitelist || {}).map(id => 
                            `- ${data.whitelist[id].username} (${id}) - ${data.whitelist[id].type}`
                        ).join('\n');
                } else {
                    document.getElementById('fileResult').innerHTML = 
                        `<span class="error">❌ Status: ${response.status}</span>`;
                }
                
            } catch (error) {
                document.getElementById('fileResult').innerHTML = 
                    `<span class="error">Error: ${error.message}</span>\n\n` +
                    `This might mean:\n` +
                    `1. API endpoint not deployed yet\n` +
                    `2. Admin secret is wrong\n` +
                    `3. CORS or network issue`;
            }
        }

        // Auto-load saved secret
        const saved = localStorage.getItem('vip_admin_secret');
        if (saved) {
            document.getElementById('adminSecret').value = saved;
        }

        // Save secret on change
        document.getElementById('adminSecret').addEventListener('change', (e) => {
            localStorage.setItem('vip_admin_secret', e.target.value);
        });
    </script>
</body>
</html>
